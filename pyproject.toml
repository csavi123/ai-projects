[project]
name = "vivaprep"
version = "0.0.1"
description = "An interview coach that grades you against your own notes"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "python-dotenv>=1", "numpy", "fastembed>=0.7", "anthropic>=2", "fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.35", "requests>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vivaprep = "vivaprep.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vivaprep"]
